<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TEMO WEIGHT</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7fbff;color:#10243a;font-family:Arial,sans-serif}.app{max-width:760px;margin:auto;padding:18px 14px 35px}.head{text-align:center;padding:10px 0 18px}.logo{font-size:26px;font-weight:900;letter-spacing:2px;color:#087ff5;text-shadow:0 0 10px #18aeea55}.sub{color:#718096;font-size:14px;margin-top:5px}.card{background:#fff;border:1px solid #dceaf5;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 8px 25px #14507812}.center{text-align:center}.date{color:#718096;font-size:14px}.weight{font-size:52px;font-weight:900;color:#087ff5;margin:12px 0}.unit{font-size:19px;color:#718096}input{width:100%;padding:15px;border:2px solid #dceaf5;border-radius:15px;font-size:22px;text-align:center;outline:0}input:focus{border-color:#18aeea}button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:15px;background:linear-gradient(135deg,#18aeea,#087ff5);color:#fff;font-size:17px;font-weight:800;box-shadow:0 6px 18px #087ff538}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:14px 8px;border:1px solid #dceaf5;border-radius:17px;text-align:center}.label{font-size:12px;color:#718096}.value{font-size:20px;font-weight:900;margin-top:6px}.green{color:#19b66b}.red{color:#ef4d5a}.title{font-size:18px;font-weight:900;margin-bottom:14px}.chart-wrap{height:260px}canvas{width:100%;height:100%;display:block}.row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid #dceaf5}.row:last-child{border:0}.rdate{font-weight:800}.small{font-size:12px;color:#718096}.rw{font-size:18px;font-weight:900}.chg{font-size:13px;font-weight:800;min-width:65px;text-align:right}.empty{text-align:center;color:#718096;padding:25px 5px}@media(max-width:520px){.stats{grid-template-columns:1fr}.stat{display:flex;justify-content:space-between;align-items:center}.weight{font-size:48px}}
</style>
</head>
<body><main class="app">
<header class="head"><div class="logo">TEMO WEIGHT</div><div class="sub">ყოველდღიური წონის ჩანაწერი</div></header>
<section class="card center"><div class="date" id="todayDate"></div><div class="weight"><span id="currentWeight">—</span> <span class="unit">კგ</span></div><input id="weightInput" type="number" min="0" max="500" step="0.1" placeholder="შეიყვანე წონა"><button id="saveBtn">⚖️ დღევანდელი წონის შენახვა</button></section>
<section class="card"><div class="stats"><div class="stat"><span class="label">წინა აწონვასთან</span><span id="dailyChange" class="value">—</span></div><div class="stat"><span class="label">საწყისთან ცვლილება</span><span id="totalChange" class="value">—</span></div><div class="stat"><span class="label">ჩანაწერები</span><span id="daysCount" class="value">0</span></div></div></section>
<section class="card"><div class="title">📊 წონის გრაფიკი</div><div class="chart-wrap"><canvas id="chart"></canvas></div></section>
<section class="card"><div class="title">📋 ისტორია</div><div id="history"></div></section>
</main>
<script>
const KEY="temo_weight_v1";let records=JSON.parse(localStorage.getItem(KEY)||"[]");records.sort((a,b)=>a.date.localeCompare(b.date));
const $=id=>document.getElementById(id),today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dateText=s=>new Date(s+"T12:00:00").toLocaleDateString("ka-GE",{day:"2-digit",month:"long",year:"numeric"}),fmt=n=>Number(n).toFixed(1),signed=n=>Math.abs(n)<.0001?"0.0 კგ":(n>0?"+":"")+fmt(n)+" კგ";
function setChange(el,n){el.textContent=n===null?"—":signed(n);el.className="value "+(n===null?"":n<0?"green":n>0?"red":"")}
function draw(){const c=$("chart"),r=c.getBoundingClientRect(),q=devicePixelRatio||1,w=r.width,h=260;c.width=w*q;c.height=h*q;const x=c.getContext("2d");x.scale(q,q);x.clearRect(0,0,w,h);if(records.length<2){x.fillStyle="#718096";x.font="14px Arial";x.textAlign="center";x.fillText("მინიმუმ 2 ჩანაწერია საჭირო გრაფიკისთვის",w/2,h/2);return}const v=records.map(r=>+r.weight),mn=Math.min(...v),mx=Math.max(...v),rg=Math.max(mx-mn,.5),lo=mn-rg*.15,hi=mx+rg*.15,p=v.map((n,i)=>({x:18+(w-36)*i/(v.length-1),y:25+(h-50)*(1-(n-lo)/(hi-lo))}));x.strokeStyle="#dceaf5";for(let i=0;i<4;i++){let y=25+(h-50)*i/3;x.beginPath();x.moveTo(18,y);x.lineTo(w-18,y);x.stroke()}x.beginPath();p.forEach((z,i)=>i?x.lineTo(z.x,z.y):x.moveTo(z.x,z.y));x.strokeStyle="#087ff5";x.lineWidth=3;x.lineJoin="round";x.stroke();p.forEach(z=>{x.beginPath();x.arc(z.x,z.y,4.5,0,Math.PI*2);x.fillStyle="#fff";x.fill();x.strokeStyle="#087ff5";x.lineWidth=3;x.stroke()})}
function render(){const t=today(),r=records.find(x=>x.date===t);$("todayDate").textContent=dateText(t);$("currentWeight").textContent=r?fmt(r.weight):"—";$("daysCount").textContent=records.length;const i=records.length-1,d=i>0?records[i].weight-records[i-1].weight:null,total=i>=0?records[i].weight-records[0].weight:null;setChange($("dailyChange"),d);setChange($("totalChange"),total);const h=$("history");if(!records.length)h.innerHTML='<div class="empty">ჯერ არცერთი წონის ჩანაწერი არ არის.</div>';else h.innerHTML=records.slice().reverse().map((r,k)=>{const j=records.length-1-k,p=j>0?r.weight-records[j-1].weight:null,cl=p===null?"":p<0?"green":p>0?"red":"";return '<div class="row"><div><div class="rdate">'+dateText(r.date)+'</div><div class="small">'+r.date+'</div></div><div class="rw">'+fmt(r.weight)+' კგ</div><div class="chg '+cl+'">'+(p===null?"—":signed(p))+'</div></div>'}).join("");draw()}
$("saveBtn").onclick=()=>{const w=Number($("weightInput").value);if(!w||w<=0||w>500)return;const d=today(),r=records.find(x=>x.date===d);if(r)r.weight=w;else records.push({date:d,weight:w});records.sort((a,b)=>a.date.localeCompare(b.date));localStorage.setItem(KEY,JSON.stringify(records));$("weightInput").value="";render()};addEventListener("resize",draw);render();
</script></body></html>
